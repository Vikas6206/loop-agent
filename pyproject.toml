[project]
name = "loop-agent"
version = "0.1.0"
description = "A self-correcting multi-agent system using LangGraph and Groq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph==1.2.10",
    "langchain==1.3.14",
    "langchain-groq==1.1.3",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "jinja2==3.1.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
